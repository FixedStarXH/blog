<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 — LUMI</title>
  <meta name="description" content="博客文章详情。">
  <link rel="stylesheet" href="css/style.css?v=15">
  <!-- 阅读进度条（固定顶部细条） -->
  <style>
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      background: var(--red);
      z-index: 9999;
      transition: width .1s ease;
    }
  </style>
  <!-- 代码高亮：highlight.js（CDN，零依赖，支持 190+ 语言） -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" defer></script>
</head>

<body>

  <div class="reading-progress" id="reading-progress"></div>
  <header class="topbar" id="topbar"></header>

  <main class="article-main">
    <div class="grid" id="article-wrap">
      <div class="loading" style="grid-column:1/13">加载中…</div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/api.js?v=9"></script>
  <script src="js/common.js?v=15"></script>
  <script src="js/article.js?v=14"></script>
</body>

</html>
