<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 博客系统</title>
  <link rel="stylesheet" href="../css/admin.css?v=11">
</head>

<body class="login-body">
  <div class="login-box">
    <div class="logo"><span class="tag"><svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="currentColor" stroke-width="2" />
          <circle cx="12" cy="12" r="3.5" fill="#E53012" />
        </svg></span>BLOG SYSTEM</div>
    <div class="sub">MANAGEMENT CONSOLE · 管理控制台</div>
    <form onsubmit="doLogin(event)">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="username" placeholder="admin" autofocus>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="password" placeholder="••••••">
      </div>
      <button class="login-btn" type="submit">登 录</button>
      <div class="err" id="login-err">用户名或密码错误</div>
    </form>
    <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--gray-a);">
      <a href="../index.html">← 返回博客首页</a>
    </div>
  </div>

  <script src="../js/api.js?v=8"></script>
  <script>
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin(e);
    });

    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-err');
      errEl.style.display = 'none';
      if (!username || !password) { errEl.textContent = '请输入用户名和密码'; errEl.style.display = 'block'; return; }
      try {
        const data = await api.post('/api/admin/login', { username, password }, true);
        localStorage.setItem('accessToken', data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        localStorage.setItem('admin', JSON.stringify(data.user));
        location.href = 'dashboard.html';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>

</html>
