<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 博客系统</title>
<link rel="stylesheet" href="../css/admin.css?v=2">
</head>
<body class="login-body">
<div class="login-box">
  <div class="logo"><span class="tag">◎</span>BLOG SYSTEM</div>
  <div class="sub">MANAGEMENT CONSOLE · 管理控制台</div>
  <form onsubmit="doLogin(event)">
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" placeholder="admin" autofocus>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" placeholder="••••••">
    </div>
    <button class="login-btn" type="submit">登 录</button>
    <div class="err" id="login-err">用户名或密码错误</div>
  </form>
  <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--gray-a);">
    <a href="../index.html">← 返回博客首页</a>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin(e);
});

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = '请输入用户名和密码'; errEl.style.display = 'block'; return; }
  try {
    const data = await api.post('/api/admin/login', { username, password });
    localStorage.setItem('token', data.token);
    localStorage.setItem('admin', JSON.stringify(data.user));
    location.href = 'dashboard.html';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
