<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 — 后台管理</title>
  <link rel="stylesheet" href="../css/admin.css?v=8">
</head>

<body>
  <div class="admin-wrap">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="main-header">
        <h1>仪表盘</h1>
        <span class="sub">Dashboard</span>
      </div>

      <div class="stats" id="stats"></div>

      <div class="panel">
        <div class="panel-head">
          <h3>热门文章 TOP5</h3>
        </div>
        <div class="panel-body">
          <table class="data">
            <thead>
              <tr>
                <th>#</th>
                <th>标题</th>
                <th>分类</th>
                <th>阅读量</th>
              </tr>
            </thead>
            <tbody id="hot-body"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>最近评论</h3>
        </div>
        <div class="panel-body">
          <table class="data">
            <thead>
              <tr>
                <th>内容</th>
                <th>昵称</th>
                <th>状态</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="comment-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js?v=7"></script>
  <script src="../js/admin-common.js?v=8"></script>
  <script>
    initAdmin('dashboard');

    async function load() {
      try {
        const d = await api.get('/api/admin/dashboard');
        const c = d.counts || {};
        document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="num red">${c.articles ?? '-'}</div><div class="lbl">文章总数</div></div>
      <div class="stat-card"><div class="num">${c.views ?? '-'}</div><div class="lbl">总浏览量</div></div>
      <div class="stat-card"><div class="num green">${c.comments ?? '-'}</div><div class="lbl">评论总数</div></div>
      <div class="stat-card"><div class="num orange">${c.pendingComments ?? '-'}</div><div class="lbl">待审核评论</div></div>`;

        document.getElementById('hot-body').innerHTML = (d.hotArticles || []).map((a, i) => `
      <tr><td>${i + 1}</td><td class="title-cell"><span class="ellipsis">${esc(a.title)}</span></td>
      <td>${esc(a.category?.name || '-')}</td><td>${a.viewCount ?? 0}</td></tr>`).join('')
          || '<tr><td colspan="4"><div class="empty">暂无数据</div></td></tr>';

        document.getElementById('comment-body').innerHTML = (d.recentComments || []).map(c => `
      <tr><td class="title-cell"><span class="ellipsis">${esc(c.content)}</span></td>
      <td>${esc(c.nickname || '匿名')}</td><td>${commentStatusBadge(c.status)}</td>
      <td>${fmtDateTime(c.createdAt)}</td></tr>`).join('')
          || '<tr><td colspan="4"><div class="empty">暂无评论</div></td></tr>';
      } catch (e) {
        toast(e.message, true);
      }
    }
    load();
  </script>
</body>

</html>
