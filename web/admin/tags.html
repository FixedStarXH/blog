<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签管理 — 后台</title>
  <link rel="stylesheet" href="../css/admin.css?v=11">
</head>

<body>
  <div class="admin-wrap">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="main-header">
        <h1>标签管理</h1>
        <button class="btn primary" onclick="openForm()">+ 新建标签</button>
      </div>

      <!-- 工具栏：关键词搜索 + 总数统计 -->
      <div class="toolbar">
        <input type="search" id="f-keyword" placeholder="搜索标签名…" onkeydown="if(event.key==='Enter')reload(1)">
        <button class="btn sm" onclick="reload(1)">搜索</button>
        <span class="toolbar-total">共 <b id="tag-total">0</b> 个标签</span>
      </div>

      <!-- 卡片网格 -->
      <div class="panel">
        <div class="panel-body" style="padding:18px;">
          <div class="tag-card-grid" id="tag-grid"></div>
        </div>
      </div>
      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <div id="form-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;">
    <div style="max-width:480px;margin:120px auto;background:#fff;border:2px solid #1A1915;padding:32px;">
      <div
        style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:2px solid #1A1915;padding-bottom:14px;">
        <h2 style="font-size:18px;font-weight:900;" id="form-title">新建标签</h2>
        <button class="btn sm" onclick="closeForm()">关闭 ✕</button>
      </div>
      <form onsubmit="save(event)">
        <input type="hidden" id="t-id">
        <div class="field"><label>标签名</label><input type="text" id="t-name" required maxlength="50"></div>
        <div class="form-actions">
          <button class="btn primary" type="submit">保存</button>
          <button class="btn" type="button" onclick="closeForm()">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js?v=8"></script>
  <script src="../js/admin-common.js?v=11"></script>
  <script>
    initAdmin('tags');

    let editingId = null;
    let page = 1;
    const pageSize = 12; // 每页 12 个标签
    let currentTags = []; // 当前页数据，供编辑回填

    async function reload(p) {
      if (p) page = p;
      const kw = document.getElementById('f-keyword').value.trim();
      const q = new URLSearchParams({ page, pageSize });
      if (kw) q.set('keyword', kw);
      try {
        const d = await api.get('/api/admin/tags?' + q.toString());
        currentTags = d.list || [];
        document.getElementById('tag-total').textContent = d.total;

        const grid = document.getElementById('tag-grid');
        grid.innerHTML = currentTags.map(t => `
      <div class="tag-card">
        <div class="tag-idx">#${String(t.id).padStart(3, '0')}</div>
        <div class="tag-name">${esc(t.name)}</div>
        <div class="tag-count"><span class="badge ${t.articleCount ? 'green' : 'gray'}">${t.articleCount ?? 0} 篇文章</span></div>
        <div class="tag-actions">
          <button class="btn sm" onclick="editById(${t.id})">编辑</button>
          <button class="btn sm danger" onclick="del(${t.id})">删除</button>
        </div>
      </div>`).join('') || '<div class="empty" style="grid-column:1/-1;">暂无标签</div>';

        renderPager(document.getElementById('pagination'), page, Math.max(1, Math.ceil(d.total / pageSize)), reload);
        // 删除最后一页的唯一标签后，自动退回上一页，避免停留在空页码
        if ((!d.list || d.list.length === 0) && page > 1 && d.total > 0) {
          page--;
          reload();
          return;
        }
      } catch (e) { toast(e.message, true); }
    }

    // 从当前页数据找标签回填（避免内联拼接转义问题）
    function editById(id) {
      const t = currentTags.find(x => x.id === id);
      if (t) edit(t);
    }

    function openForm() {
      editingId = null;
      document.getElementById('form-title').textContent = '新建标签';
      document.getElementById('t-id').value = '';
      document.getElementById('t-name').value = '';
      document.getElementById('form-modal').style.display = 'block';
    }

    function edit(t) {
      editingId = t.id;
      document.getElementById('form-title').textContent = '编辑标签 #' + String(t.id).padStart(3, '0');
      document.getElementById('t-id').value = t.id;
      document.getElementById('t-name').value = t.name;
      document.getElementById('form-modal').style.display = 'block';
    }

    function closeForm() { document.getElementById('form-modal').style.display = 'none'; }

    async function save(e) {
      e.preventDefault();
      const name = document.getElementById('t-name').value.trim();
      try {
        if (editingId) await api.put('/api/admin/tags/' + editingId, { name });
        else await api.post('/api/admin/tags', { name });
        toast('保存成功');
        closeForm();
        reload();
      } catch (err) { toast(err.message, true); }
    }

    async function del(id) {
      if (!confirm('确定删除该标签?')) return;
      try {
        await api.del('/api/admin/tags/' + id);
        toast('已删除');
        reload();
      } catch (e) { toast(e.message, true); }
    }

    reload(1);
  </script>
</body>

</html>
