<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标签管理 — 后台</title>
  <link rel="stylesheet" href="../css/admin.css?v=8">
</head>

<body>
  <div class="admin-wrap">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="main-header">
        <h1>标签管理</h1>
        <button class="btn primary" onclick="openForm()">+ 新建标签</button>
      </div>
      <div class="panel">
        <div class="panel-body" style="padding:0;">
          <table class="data">
            <thead>
              <tr>
                <th>ID</th>
                <th>标签名</th>
                <th>文章数</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="form-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;">
    <div style="max-width:480px;margin:120px auto;background:#fff;border:2px solid #1A1915;padding:32px;">
      <div
        style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:2px solid #1A1915;padding-bottom:14px;">
        <h2 style="font-size:18px;font-weight:900;" id="form-title">新建标签</h2>
        <button class="btn sm" onclick="closeForm()">关闭 ✕</button>
      </div>
      <form onsubmit="save(event)">
        <input type="hidden" id="t-id">
        <div class="field"><label>标签名</label><input type="text" id="t-name" required maxlength="50"></div>
        <div class="form-actions">
          <button class="btn primary" type="submit">保存</button>
          <button class="btn" type="button" onclick="closeForm()">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js?v=7"></script>
  <script src="../js/admin-common.js?v=8"></script>
  <script>
    initAdmin('tags');
    let editingId = null;

    async function reload() {
      try {
        const list = await api.get('/api/admin/tags');
        document.getElementById('tbody').innerHTML = list.map(t => `
      <tr>
        <td>${t.id}</td>
        <td><b># ${esc(t.name)}</b></td>
        <td>${t.articleCount ?? 0}</td>
        <td class="actions">
          <button class="btn sm" onclick='edit(${JSON.stringify(t).replace(/'/g, "\\'")})'>编辑</button>
          <button class="btn sm danger" onclick="del(${t.id})">删除</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="4"><div class="empty">暂无标签</div></td></tr>';
      } catch (e) { toast(e.message, true); }
    }

    function openForm() {
      editingId = null;
      document.getElementById('form-title').textContent = '新建标签';
      document.getElementById('t-id').value = '';
      document.getElementById('t-name').value = '';
      document.getElementById('form-modal').style.display = 'block';
    }

    function edit(t) {
      editingId = t.id;
      document.getElementById('form-title').textContent = '编辑标签 #' + t.id;
      document.getElementById('t-id').value = t.id;
      document.getElementById('t-name').value = t.name;
      document.getElementById('form-modal').style.display = 'block';
    }

    function closeForm() { document.getElementById('form-modal').style.display = 'none'; }

    async function save(e) {
      e.preventDefault();
      const name = document.getElementById('t-name').value.trim();
      try {
        if (editingId) await api.put('/api/admin/tags/' + editingId, { name });
        else await api.post('/api/admin/tags', { name });
        toast('保存成功');
        closeForm();
        reload();
      } catch (err) { toast(err.message, true); }
    }

    async function del(id) {
      if (!confirm('确定删除该标签?')) return;
      try {
        await api.del('/api/admin/tags/' + id);
        toast('已删除');
        reload();
      } catch (e) { toast(e.message, true); }
    }

    reload();
  </script>
</body>

</html>
