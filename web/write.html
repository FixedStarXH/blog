<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 — 博客系统</title>
  <meta name="description" content="投稿新文章，审核通过后公开展示。">
  <link rel="stylesheet" href="css/style.css?v=15">
  <style>
    .write-main {
      padding: 40px 0 80px;
    }

    .write-head {
      grid-column: 1/13;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .write-head h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -.01em;
    }

    .write-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      border: 2px solid var(--ink);
      padding: 8px 16px;
      background: var(--white);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .write-back:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--red);
      color: var(--ink);
    }

    .write-form {
      grid-column: 1/13;
      border: 1px solid var(--ink);
      background: var(--white);
      padding: 32px;
    }

    .write-form .field {
      margin-bottom: 18px;
    }

    .write-form label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-6);
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .write-form input[type="text"],
    .write-form textarea,
    .write-form select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 12px 14px;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      font-family: inherit;
      transition: border-color .15s ease;
    }

    .write-form input[type="text"]:focus,
    .write-form textarea:focus,
    .write-form select:focus {
      border-color: var(--red);
    }

    .write-form textarea {
      resize: vertical;
      line-height: 1.7;
    }

    .write-form select {
      cursor: pointer;
    }

    .write-hint {
      font-size: 12px;
      color: var(--gray-6);
      margin-top: 6px;
    }

    /* 标签多选 chips：点击切换选中态，选中后红底 */
    .tag-pick {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag-pick .chip {
      border: 2px solid var(--ink);
      background: var(--white);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    }

    .tag-pick .chip:hover {
      transform: rotate(-2deg) scale(1.05);
    }

    .tag-pick .chip.on {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    /* 驳回原因提示条 */
    .reject-tip {
      border: 2px solid var(--red);
      background: #FBE9E3;
      color: #C1240B;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    body.dark .reject-tip {
      background: #3A1F18;
      color: #FF8A70;
    }

    .write-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    .write-actions .btn-solid {
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 13px 32px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
      transition: background .15s ease, transform .18s ease, box-shadow .18s ease;
    }

    .write-actions .btn-solid:hover {
      background: var(--red);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .write-actions .cancel {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-6);
    }

    .write-actions .cancel:hover {
      color: var(--red);
    }
  </style>
</head>

<body>

  <header class="topbar" id="topbar"></header>

  <section class="write-main">
    <div class="grid">
      <div class="write-head">
        <h1 id="page-title">写文章</h1>
        <a class="write-back" href="me.html">← 返回个人中心</a>
      </div>

      <div class="write-form">
        <div class="reject-tip" id="reject-tip" style="display:none;"></div>
        <form onsubmit="saveArticle(event)">
          <div class="field">
            <label>标题 *</label>
            <input type="text" id="f-title" required maxlength="200" placeholder="起一个吸引人的标题">
          </div>
          <div class="field">
            <label>分类 *</label>
            <select id="f-category" required></select>
          </div>
          <div class="field">
            <label>标签（可多选）</label>
            <div class="tag-pick" id="f-tags"></div>
            <div class="write-hint">点击标签切换选中，选中标签会以红色高亮</div>
          </div>
          <div class="field">
            <label>摘要</label>
            <input type="text" id="f-summary" maxlength="500" placeholder="一句话概括文章内容（列表页展示）">
          </div>
          <div class="field">
            <label>封面图 URL</label>
            <input type="text" id="f-cover" placeholder="可选，例如 /uploads/2026/08/01/xxx.jpg">
          </div>
          <div class="field">
            <label>正文（支持 HTML）*</label>
            <textarea id="f-content" required rows="16"
              placeholder="<p>支持 HTML，代码块用 &lt;pre&gt;&lt;code&gt;…&lt;/code&gt;&lt;/pre&gt;</p>"></textarea>
          </div>
          <div class="write-actions">
            <button class="btn-solid" type="submit" id="submit-btn">提交审核</button>
            <a class="cancel" href="me.html">取消</a>
            <span class="write-hint" id="submit-hint">投稿后需编辑审核通过才会公开展示</span>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="js/api.js?v=9"></script>
  <script src="js/common.js?v=15"></script>
  <script>
    initPage('me');

    // 未登录 → 跳登录
    const token = localStorage.getItem('token');
    if (!token) { location.href = 'login.html'; }

    const editId = getParam('id'); // ?id=xxx 表示编辑模式
    const selectedTags = new Set();
    let allTags = [];

    (async function init() {
      await loadCats();
      await loadTags();
      if (editId) await loadArticle(editId);
    })();

    // 加载分类（公开接口）
    async function loadCats() {
      try {
        const cats = await api.get('/api/categories');
        document.getElementById('f-category').innerHTML =
          '<option value="">请选择分类</option>' +
          cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
      } catch (e) { toast('分类加载失败', true); }
    }

    // 加载标签（公开接口）并渲染多选 chips
    async function loadTags() {
      try {
        allTags = await api.get('/api/tags');
        renderTagChips();
      } catch (e) { toast('标签加载失败', true); }
    }

    function renderTagChips() {
      document.getElementById('f-tags').innerHTML = allTags.map(t => `
    <span class="chip ${selectedTags.has(t.id) ? 'on' : ''}"
      data-id="${t.id}" onclick="toggleTag(${t.id}, this)">${esc(t.name)}</span>`).join('') ||
        '<span class="write-hint">暂无标签</span>';
    }

    function toggleTag(id, el) {
      if (selectedTags.has(id)) { selectedTags.delete(id); el.classList.remove('on'); }
      else { selectedTags.add(id); el.classList.add('on'); }
    }

    // 编辑模式：拉取自己的文章回显
    async function loadArticle(id) {
      try {
        const a = await api.get('/api/my/articles/' + id);
        document.getElementById('page-title').textContent = '编辑文章';
        document.getElementById('submit-btn').textContent = '保存修改';
        document.getElementById('submit-hint').textContent = '保存后需编辑重新审核才会更新公开展示';
        document.getElementById('f-title').value = a.title;
        document.getElementById('f-summary').value = a.summary || '';
        document.getElementById('f-cover').value = a.coverImage || '';
        document.getElementById('f-content').value = a.content || '';
        document.getElementById('f-category').value = a.categoryId || '';
        (a.tags || []).forEach(t => selectedTags.add(t.id));
        renderTagChips();
        // 被驳回的文章：提示原因，鼓励修改重提
        if (a.status === 3) {
          const tip = document.getElementById('reject-tip');
          tip.style.display = 'block';
          tip.textContent = '你的这篇投稿被驳回了：' + (a.rejectReason || '未填写原因') + '。修改后重新提交即可再次进入审核。';
        }
      } catch (e) { toast(e.message, true); }
    }

    async function saveArticle(e) {
      e.preventDefault();
      const title = document.getElementById('f-title').value.trim();
      const categoryId = parseInt(document.getElementById('f-category').value);
      const payload = {
        title,
        summary: document.getElementById('f-summary').value.trim(),
        coverImage: document.getElementById('f-cover').value.trim(),
        content: document.getElementById('f-content').value,
        categoryId,
        tagIds: Array.from(selectedTags),
        password: '',
        publishAt: null,
      };
      if (!categoryId) { toast('请选择分类', true); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        if (editId) await api.put('/api/my/articles/' + editId, payload);
        else await api.post('/api/my/articles', payload);
        toast(editId ? '保存成功' : '投稿成功，等待审核');
        setTimeout(() => { location.href = 'me.html'; }, 800);
      } catch (err) {
        toast(err.message, true);
        btn.disabled = false;
      }
    }
  </script>
</body>

</html>
