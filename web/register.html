<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 — 博客系统</title>
  <meta name="description" content="注册博客系统账号,开启投稿。">
  <link rel="stylesheet" href="css/style.css?v=22">
  <style>
    .auth-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-box {
      width: 400px;
    }

    .auth-box .box {
      border: 1px solid var(--ink);
      background: var(--white);
      padding: 36px;
    }

    .auth-box h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.01em;
    }

    .auth-box .sub {
      font-size: 11px;
      color: var(--gray-6);
      letter-spacing: .16em;
      text-transform: uppercase;
      margin: 6px 0 24px;
    }

    .auth-box .field {
      margin-bottom: 16px;
    }

    .auth-box .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-6);
      margin-bottom: 6px;
    }

    .auth-box .field input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 12px 14px;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color .15s ease;
    }

    .auth-box .field input:focus {
      border-color: var(--red);
    }

    .auth-box .field .hint {
      font-size: 11px;
      color: var(--gray-a);
      margin-top: 4px;
    }

    .auth-box .auth-btn {
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .14em;
      cursor: pointer;
      transition: background .15s ease;
    }

    .auth-box .auth-btn:hover {
      background: var(--red);
    }

    .auth-box .err {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }

    .auth-box .switch {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--gray-6);
    }

    .auth-box .switch a {
      color: var(--red);
      font-weight: 600;
    }

    .auth-back {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--gray-6);
    }

    .auth-back a:hover {
      color: var(--red);
    }

    /* 浮动标签输入框：label 默认浮在框内，聚焦或有内容时上浮变小变红 */
    .auth-box .float-field {
      position: relative;
      margin-bottom: 16px;
    }

    .auth-box .float-field input {
      padding: 19px 14px 8px;
    }

    .auth-box .float-field label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-a);
      margin: 0;
      pointer-events: none;
      transition: top .18s ease, transform .18s ease, font-size .18s ease, color .18s ease;
    }

    .auth-box .float-field input:focus+label,
    .auth-box .float-field input:not(:placeholder-shown)+label {
      top: 10px;
      transform: translateY(-50%) scale(.72);
      transform-origin: left top;
      color: var(--red);
    }
  </style>
</head>

<body>
  <div class="auth-body">
    <div class="auth-box">
      <div class="box">
        <h1>注册</h1>
        <div class="sub">Create Account</div>
        <form onsubmit="doRegister(event)">
          <div class="field float-field">
            <input type="text" id="username" placeholder=" " autofocus>
            <label for="username">用户名</label>
          </div>
          <div class="field float-field">
            <input type="email" id="email" placeholder=" ">
            <label for="email">邮箱</label>
          </div>
          <div class="field float-field">
            <input type="password" id="password" placeholder=" ">
            <label for="password">密码</label>
          </div>
          <div class="field float-field">
            <input type="password" id="password2" placeholder=" ">
            <label for="password2">确认密码</label>
          </div>
          <button class="auth-btn" type="submit">注 册</button>
          <div class="err" id="reg-err">注册失败</div>
        </form>
        <div class="switch">已有账号?<a href="login.html">直接登录</a></div>
      </div>
      <div class="auth-back"><a href="index.html">← 返回首页</a></div>
    </div>
  </div>

  <script src="js/api.js?v=11"></script>
  <script>
    document.getElementById('password2').addEventListener('keydown', e => {
      if (e.key === 'Enter') doRegister(e);
    });

    async function doRegister(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const errEl = document.getElementById('reg-err');
      errEl.style.display = 'none';

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { errEl.textContent = '用户名需 3-20 位字母数字下划线'; errEl.style.display = 'block'; return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { errEl.textContent = '邮箱格式不正确'; errEl.style.display = 'block'; return; }
      if (password.length < 6) { errEl.textContent = '密码至少 6 位'; errEl.style.display = 'block'; return; }
      if (password !== password2) { errEl.textContent = '两次密码不一致'; errEl.style.display = 'block'; return; }

      try {
        const data = await api.post('/api/auth/register', { username, email, password }, true);
        localStorage.setItem('accessToken', data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        localStorage.setItem('admin', JSON.stringify(data.user));
        location.href = 'me.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>

</html>
