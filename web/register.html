<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 — 博客系统</title>
  <meta name="description" content="注册博客系统账号,开启投稿。">
  <link rel="stylesheet" href="css/style.css?v=17">
  <style>
    .auth-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-box {
      width: 400px;
    }

    .auth-box .box {
      border: 1px solid var(--ink);
      background: var(--white);
      padding: 36px;
    }

    .auth-box h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.01em;
    }

    .auth-box .sub {
      font-size: 11px;
      color: var(--gray-6);
      letter-spacing: .16em;
      text-transform: uppercase;
      margin: 6px 0 24px;
    }

    .auth-box .field {
      margin-bottom: 16px;
    }

    .auth-box .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gray-6);
      margin-bottom: 6px;
    }

    .auth-box .field input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 12px 14px;
      font-size: 14px;
      color: var(--ink);
      outline: none;
      transition: border-color .15s ease;
    }

    .auth-box .field input:focus {
      border-color: var(--red);
    }

    .auth-box .field .hint {
      font-size: 11px;
      color: var(--gray-a);
      margin-top: 4px;
    }

    .auth-box .auth-btn {
      width: 100%;
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .14em;
      cursor: pointer;
      transition: background .15s ease;
    }

    .auth-box .auth-btn:hover {
      background: var(--red);
    }

    .auth-box .err {
      color: var(--red);
      font-size: 13px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }

    .auth-box .switch {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--gray-6);
    }

    .auth-box .switch a {
      color: var(--red);
      font-weight: 600;
    }

    .auth-back {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--gray-6);
    }

    .auth-back a:hover {
      color: var(--red);
    }
  </style>
</head>

<body>
  <div class="auth-body">
    <div class="auth-box">
      <div class="box">
        <h1>注册</h1>
        <div class="sub">Create Account</div>
        <form onsubmit="doRegister(event)">
          <div class="field">
            <label>用户名</label>
            <input type="text" id="username" placeholder="3-20 位字母数字下划线" autofocus>
          </div>
          <div class="field">
            <label>邮箱</label>
            <input type="email" id="email" placeholder="you@example.com">
          </div>
          <div class="field">
            <label>密码</label>
            <input type="password" id="password" placeholder="至少 6 位">
          </div>
          <div class="field">
            <label>确认密码</label>
            <input type="password" id="password2" placeholder="再次输入密码">
          </div>
          <button class="auth-btn" type="submit">注 册</button>
          <div class="err" id="reg-err">注册失败</div>
        </form>
        <div class="switch">已有账号?<a href="login.html">直接登录</a></div>
      </div>
      <div class="auth-back"><a href="index.html">← 返回首页</a></div>
    </div>
  </div>

  <script src="js/api.js?v=10"></script>
  <script>
    document.getElementById('password2').addEventListener('keydown', e => {
      if (e.key === 'Enter') doRegister(e);
    });

    async function doRegister(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const errEl = document.getElementById('reg-err');
      errEl.style.display = 'none';

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { errEl.textContent = '用户名需 3-20 位字母数字下划线'; errEl.style.display = 'block'; return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { errEl.textContent = '邮箱格式不正确'; errEl.style.display = 'block'; return; }
      if (password.length < 6) { errEl.textContent = '密码至少 6 位'; errEl.style.display = 'block'; return; }
      if (password !== password2) { errEl.textContent = '两次密码不一致'; errEl.style.display = 'block'; return; }

      try {
        const data = await api.post('/api/auth/register', { username, email, password });
        localStorage.setItem('token', data.token);
        localStorage.setItem('admin', JSON.stringify(data.user));
        location.href = 'me.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }
  </script>
</body>

</html>
