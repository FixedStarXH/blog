<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 — 博客系统</title>
  <meta name="description" content="我的投稿与个人资料。">
  <link rel="stylesheet" href="css/style.css?v=15">
  <style>
    .me-main {
      padding: 40px 0 60px;
    }

    .me-main .profile {
      grid-column: 1/4;
    }

    .me-main .panel {
      grid-column: 4/13;
    }

    .me-avatar {
      width: 120px;
      height: 120px;
      background: var(--ink);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 900;
    }

    .me-main .username {
      font-size: 22px;
      font-weight: 900;
      margin-top: 14px;
    }

    .me-main .role {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 3px 10px;
      border: 1px solid var(--ink);
      margin-top: 8px;
    }

    .me-main .role.editor {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .me-main .role.admin {
      background: var(--ink);
      color: var(--paper);
    }

    .me-main .email {
      font-size: 12px;
      color: var(--gray-6);
      margin-top: 10px;
      font-family: var(--mono);
    }

    .me-main .stats-row {
      display: flex;
      gap: 20px;
      margin-top: 18px;
    }

    .me-main .stats-row .st {
      border: 1px solid var(--line);
      background: var(--white);
      padding: 12px 18px;
      text-align: center;
    }

    .me-main .stats-row .st .n {
      font-size: 20px;
      font-weight: 900;
    }

    .me-main .stats-row .st .l {
      font-size: 11px;
      color: var(--gray-6);
    }

    .me-nav {
      margin-top: 22px;
      border-top: 2px solid var(--ink);
    }

    .me-nav .tab {
      display: block;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      font-weight: 600;
      transition: color .15s ease;
    }

    .me-nav .tab:hover,
    .me-nav .tab.active {
      color: var(--red);
    }

    /* 我的文章表 */
    .me-articles {
      border: 1px solid var(--line);
      background: var(--white);
    }

    .me-articles .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 2px solid var(--ink);
    }

    .me-articles .head h3 {
      font-size: 16px;
      font-weight: 900;
    }

    .me-articles .head a {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
    }

    table.data {
      width: 100%;
      border-collapse: collapse;
    }

    table.data th {
      text-align: left;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gray-6);
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }

    table.data td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge.green {
      background: #E4F0E9;
      color: #1D7A4F;
    }

    .badge.gray {
      background: var(--paper-2);
      color: var(--gray-6);
    }

    .badge.orange {
      background: #FBF1E3;
      color: #C2560B;
    }

    .badge.red {
      background: #FBE9E3;
      color: #C1240B;
    }
  </style>
</head>

<body>

  <header class="topbar" id="topbar"></header>

  <section class="me-main">
    <div class="grid" id="me-wrap">
      <div class="loading" style="grid-column:1/13">加载中…</div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="js/api.js?v=9"></script>
  <script src="js/common.js?v=15"></script>
  <script>
    initPage('me').then(loadMe);

    async function loadMe() {
      const wrap = document.getElementById('me-wrap');
      const token = localStorage.getItem('token');
      if (!token) {
        wrap.innerHTML = `<div class="empty" style="grid-column:1/13">
      请先<a href="login.html" style="color:var(--red);">登录</a>再访问个人中心</div>`;
        return;
      }
      try {
        const me = await api.get('/api/auth/me');
        const roleMap = { 1: '普通用户', 2: '编辑', 3: '管理员' };
        const myArts = await api.get('/api/my/articles?page=1&pageSize=20');
        renderMe(me, myArts);
      } catch (e) {
        wrap.innerHTML = `<div class="empty" style="grid-column:1/13">${esc(e.message)}</div>`;
      }
    }

    function statusBadge(s) {
      switch (s) {
        case 1: return '<span class="badge green">已发布</span>';
        case 0: return '<span class="badge gray">草稿</span>';
        case 2: return '<span class="badge orange">待审核</span>';
        case 3: return '<span class="badge red">已驳回</span>';
        default: return '<span class="badge gray">未知</span>';
      }
    }

    function renderMe(me, arts) {
      const wrap = document.getElementById('me-wrap');
      const roleMap = { 1: '普通用户', 2: '编辑', 3: '管理员' };
      const roleCls = me.role === 2 ? 'editor' : (me.role === 3 ? 'admin' : '');

      wrap.innerHTML = `
    <div class="profile">
      <div class="me-avatar">${esc((me.nickname || me.username || 'U').charAt(0).toUpperCase())}</div>
      <div class="username">${esc(me.nickname || me.username)}</div>
      <span class="role ${roleCls}">${roleMap[me.role] || '用户'}</span>
      <div class="email">${esc(me.email || '')}</div>
      <div class="stats-row">
        <div class="st"><div class="n">${arts.total ?? 0}</div><div class="l">文章</div></div>
        <div class="st"><div class="n">${arts.list.filter(a => a.status === 1).length}</div><div class="l">已发布</div></div>
      </div>
      <nav class="me-nav">
        <a class="tab active" href="javascript:;">我的文章</a>
        <a class="tab" href="write.html">投稿新文章</a>
        <a class="tab" href="index.html">返回首页</a>
      </nav>
    </div>

    <div class="panel">
      <div class="me-articles">
        <div class="head">
          <h3>我的投稿</h3>
          <a href="write.html">+ 写新文章</a>
        </div>
        <table class="data">
          <thead><tr><th>标题</th><th>分类</th><th>状态</th><th>阅读</th><th>发布时间</th><th>操作</th></tr></thead>
          <tbody id="my-tbody"></tbody>
        </table>
      </div>
    </div>`;

      const tbody = document.getElementById('my-tbody');
      if (!arts.list || !arts.list.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--gray-a);padding:40px;">还没有投稿,点击右上角写第一篇文章吧</td></tr>';
      } else {
        tbody.innerHTML = arts.list.map(a => `
      <tr>
        <td style="font-weight:600;">${esc(a.title)}</td>
        <td>${esc(a.category?.name || '-')}</td>
        <td>${statusBadge(a.status)}
          ${a.status === 3 ? `<br><small style="color:var(--red);">${esc(a.rejectReason || '')}</small>` : ''}
        </td>
        <td>${a.viewCount ?? 0}</td>
        <td style="font-family:monospace;font-size:12px;">${fmtDate(a.publishAt || a.createdAt)}</td>
        <td>
          ${a.status === 1 ? `<a href="article.html?id=${a.id}" style="color:var(--red);font-size:12px;margin-right:8px;">查看</a>` : ''}
          <a href="write.html?id=${a.id}" style="font-size:12px;margin-right:8px;">编辑</a>
          <a href="javascript:;" onclick="delMyArt(${a.id})" style="color:var(--red);font-size:12px;">删除</a>
        </td>
      </tr>`).join('');
      }
    }

    async function delMyArt(id) {
      if (!confirm('确定删除这篇文章?')) return;
      try {
        await api.del('/api/my/articles/' + id);
        toast('已删除');
        loadMe();
      } catch (e) { toast(e.message, true); }
    }
  </script>
</body>

</html>
